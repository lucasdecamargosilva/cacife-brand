<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
  <title>Redefinir senha | Provou Levou</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#241635;font:16px Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.recovery-card{width:100%;max-width:440px;background:white;border:1px solid #e6dff0;border-radius:16px;padding:32px}img{width:190px;height:auto;margin-bottom:28px}h1{font-size:25px;letter-spacing:-.04em;margin:0 0 12px}p{font-size:14px;line-height:1.6;color:#62536f}label{display:grid;gap:8px;margin:20px 0;font-size:14px}input{font:inherit;padding:12px;border:1px solid #d8cbe8;border-radius:8px;width:100%;min-height:44px}button,a{display:block;width:100%;background:#7c3aed;color:white;text-align:center;font:inherit;padding:13px;border:0;border-radius:8px;text-decoration:none;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:2px solid #7c3aed;outline-offset:3px}[hidden]{display:none!important}.error{color:#a23c36}.success{color:#137d58}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
</head>
<body>
  <main class="recovery-card">
    <img src="provoulevou-logo.png" alt="Provou Levou"><h1>Crie uma nova senha</h1>
    <p id="recovery-status" role="status" aria-live="polite">Validando o link de recuperação…</p>
    <form id="recovery-form" hidden>
      <label>Nova senha<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
      <label>Confirme a nova senha<input name="confirmation" type="password" minlength="8" autocomplete="new-password" required></label>
      <p>Use pelo menos 8 caracteres.</p><button type="submit">Salvar nova senha</button>
    </form>
    <a id="recovery-done" href="metricas.html" hidden>Abrir painel de métricas</a>
  </main>
  <script src="redefinir-senha.js"></script>
</body>
</html>
