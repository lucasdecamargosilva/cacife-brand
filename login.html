<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Cacife Brand</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --canvas: #f6f7f9; --panel: #fff; --line: #eceef2;
            --text: #111827; --secondary: #4b5563; --muted: #6b7280; --danger: #dc2626;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--canvas);
            color: var(--text);
            font-family: 'DM Sans', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .login-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 1px 2px #1118270a, 0 12px 32px #1118270f;
            padding: 36px 32px 28px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo { width: 164px; height: auto; margin-bottom: 8px; display: inline-block; filter: brightness(0); }
        .login-title { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 18px 0 4px; }
        .login-sub { font-size: 13px; color: var(--secondary); margin: 0 0 26px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-label { display: block; margin-bottom: 7px; color: var(--secondary); font-size: 12.5px; font-weight: 600; }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; pointer-events: none; }
        .form-input {
            width: 100%;
            min-height: 42px;
            padding: 10px 14px 10px 38px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 9px;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .form-input::placeholder { color: #9ca3af; }
        .form-input:focus { border-color: #111827; box-shadow: 0 0 0 3px #1118271a; }
        .btn-login {
            width: 100%;
            min-height: 42px;
            margin-top: 8px;
            background: #111827;
            color: #fff;
            border: 1px solid #111827;
            border-radius: 9px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color .15s, opacity .15s;
        }
        .btn-login:hover { background: #1f2937; }
        .btn-login:active:not(:disabled) { transform: scale(.98); }
        .btn-login:focus-visible { outline: 3px solid #1118274d; outline-offset: 2px; }
        .btn-login:disabled { opacity: .6; cursor: not-allowed; }
        .error-msg { color: var(--danger); font-size: 12.5px; margin-top: 14px; min-height: 18px; opacity: 0; transition: opacity .2s; }
        .error-msg.visible { opacity: 1; }
        .login-foot { margin-top: 18px; font-size: 11.5px; color: var(--muted); }
    </style>
</head>

<body>

    <div class="login-card">
        <img src="cacife-logo.png" alt="Cacife Brand" class="login-logo">
        <h1 class="login-title">Entrar no painel</h1>
        <p class="login-sub">Acompanhe todos os seus canais em um só lugar.</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email" class="form-label">E-mail</label>
                <div class="input-wrap">
                    <i class="ph ph-envelope"></i>
                    <input type="email" id="email" class="form-input" autocomplete="email"
                        placeholder="seu@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Senha</label>
                <div class="input-wrap">
                    <i class="ph ph-lock"></i>
                    <input type="password" id="password" class="form-input" autocomplete="current-password"
                        placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-login" id="login-btn">Entrar</button>
            <div id="error-message" class="error-msg" role="alert"></div>
        </form>
        <p class="login-foot">Cacife Brand · Provou Levou</p>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('error-message');

        const { createClient } = supabase;
        const supabaseClient = createClient(window.SUPABASE_CONFIG.URL, window.SUPABASE_CONFIG.KEY);

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorMsg.classList.remove('visible');
            errorMsg.textContent = '';
            loginBtn.textContent = 'Entrando...';
            loginBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                // Sucesso!
                loginBtn.textContent = 'Sucesso!';
                setTimeout(() => {
                    window.location.href = 'metricas.html';
                }, 500);

            } catch (err) {
                console.error("Login error:", err);
                errorMsg.textContent = 'E-mail ou senha inválidos.';
                errorMsg.classList.add('visible');
                loginBtn.textContent = 'Entrar';
                loginBtn.disabled = false;
            }
        });

        // Verificar se já está logado
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'metricas.html';
            }
        }
        checkSession();

    </script>
</body>

</html>
